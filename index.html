<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAW | STRAIGHT TO THE MEAT</title>
    <!-- TELEGRAM WEB APP SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* CSS RESET & VARIABLES */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { 
            --bg: #f4f1e9; 
            --black: #000000; 
            --red: #d71920; 
            --dim: #777777; 
            --sans: "Helvetica Neue", Helvetica, "Arial Black", sans-serif; 
            --mono: "Space Mono", "Courier New", Courier, monospace; 
        }
        body { 
            background-color: var(--bg); 
            color: var(--black); 
            font-family: var(--sans); 
            -webkit-font-smoothing: antialiased; 
            user-select: none;
        }
        
        /* HEADER & ANNOUNCEMENT */
        header { 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; 
            padding: 1rem 2rem; 
            border-bottom: 2px solid var(--black); 
            font-weight: 900; 
            font-size: 1rem; 
            text-transform: uppercase; 
        }
        header .admin-link { text-align: right; cursor: pointer; text-decoration: underline; color: var(--black); }
        .announcement { 
            padding: 0.6rem 2rem; 
            border-bottom: 2px solid var(--black); 
            font-family: var(--mono); 
            font-size: 0.85rem; 
            display: flex; 
            align-items: center; 
            gap: 1rem; 
            text-transform: uppercase; 
        }
        .status-dot { 
            width: 10px; height: 10px; 
            background-color: var(--red); 
            border-radius: 50%; 
            display: inline-block; 
            animation: pulse 2s infinite; 
        }
        .status-dot.dead { background-color: var(--dim); animation: none; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* PRODUCT GRID */
        main.grid { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 2px solid var(--black); }
        .card { display: flex; flex-direction: column; border-right: 2px solid var(--black); border-bottom: 2px solid var(--black); cursor: pointer; position: relative; }
        .card:nth-child(even) { border-right: none; }
        .card:nth-last-child(1), .card:nth-last-child(2) { border-bottom: none; }
        .img-wrapper { position: relative; overflow: hidden; background: #ffffff; flex-grow: 1; display: flex; align-items: center; justify-content: center; aspect-ratio: 4/5; }
        .card.gone .img-wrapper img { opacity: 0.4; filter: grayscale(100%); }
        .stamp { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); color: var(--red); border: 4px solid var(--red); padding: 0.5rem 1.5rem; font-size: 3rem; font-weight: 900; letter-spacing: 2px; pointer-events: none; z-index: 10; }
        .card img { transition: transform 0.3s ease; width: 85%; }
        .card:hover:not(.gone) img { transform: scale(1.03); }
        
        /* FOOTERS */
        .card-footer { padding: 1rem 2rem; border-top: 2px solid var(--black); background-color: var(--bg); }
        .card-title { font-weight: 900; font-size: 1.2rem; margin-bottom: 0.5rem; text-transform: uppercase; }
        .card-meta { font-family: var(--mono); font-size: 0.85rem; display: flex; justify-content: space-between; text-transform: uppercase; margin-bottom: 0.2rem; }
        .card-state { font-family: var(--mono); font-size: 0.85rem; display: flex; justify-content: space-between; color: var(--dim); text-transform: uppercase; }
        .locked-by-text { color: var(--red); font-weight: bold; }

        /* MODAL */
        .modal { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: none; flex-direction: column; overflow-y: auto; padding-bottom: 80px; }
        .modal-body { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; padding: 2rem 4rem; }
        .modal-img { border: 2px solid var(--black); background: #ffffff; padding: 3rem; display: flex; align-items: center; justify-content: center; }
        .modal-img img { width: 100%; }
        .m-title { font-size: 3rem; font-weight: 900; line-height: 1; margin-bottom: 0.5rem; text-transform: uppercase; }
        .m-meta { font-family: var(--mono); font-size: 1.1rem; margin-bottom: 1.5rem; text-transform: uppercase;}
        .m-status { font-family: var(--mono); font-size: 1rem; font-weight: bold; margin-bottom: 2rem; display: flex; align-items: center; gap: 0.8rem; }
        
        .size-selector { display: flex; gap: 1rem; margin-bottom: 2rem; }
        .size-btn { border: 2px solid var(--black); background: transparent; padding: 0.8rem 1.2rem; font-family: var(--mono); font-size: 1rem; cursor: pointer; }
        .size-btn.active { background: var(--black); color: var(--bg); }

        /* BUTTONS */
        .purchase-options { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; }
        .btn { padding: 1.2rem; font-weight: 900; font-size: 1.1rem; text-align: center; cursor: pointer; border: 2px solid var(--black); text-transform: uppercase; }
        .btn-buy { background: var(--black); color: var(--bg); }
        .btn-lock { background: transparent; color: var(--red); border-color: var(--red); }
        .subtext { font-family: var(--mono); font-size: 0.75rem; margin-top: 0.5rem; color: var(--dim); text-align: center; }

        /* CHECKOUT FORM IN MODAL */
        .checkout-form { display: none; border-top: 2px solid var(--black); padding-top: 2rem; margin-top: 1rem; }
        .form-title { font-weight: 900; font-size: 1.2rem; margin-bottom: 1rem; text-transform: uppercase; }
        .input-group { margin-bottom: 1rem; position: relative; }
        .input-group label { display: block; font-family: var(--mono); font-size: 0.85rem; margin-bottom: 0.5rem; }
        .input-group input { width: 100%; padding: 1rem; border: 2px solid var(--dim); background: transparent; font-family: var(--mono); font-size: 1rem; outline: none; }
        .input-group input:focus { border-color: var(--black); }
        .lock-name-group { display: none; }
        
        /* 1-TAP PHONE SHARE BUTTON */
        .btn-share-phone {
            position: absolute; right: 5px; top: 28px;
            background: var(--black); color: var(--bg);
            border: none; padding: 0.6rem 0.8rem;
            font-family: var(--mono); font-size: 0.75rem;
            cursor: pointer; text-transform: uppercase;
        }

        .btn-story {
            width: 100%; background: transparent; color: var(--black);
            border: 2px solid var(--black); padding: 1rem; margin-top: 1rem;
            font-family: var(--mono); font-weight: bold; cursor: pointer; text-transform: uppercase;
        }

        @media (max-width: 900px) {
            main.grid { grid-template-columns: 1fr; }
            .modal-body { grid-template-columns: 1fr; gap: 2rem; padding: 1.5rem; }
            .m-title { font-size: 2.2rem; }
            .purchase-options { grid-template-columns: 1fr; gap: 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">RAW</div>
        <div>STRAIGHT TO THE MEAT</div>
        <div class="admin-link" onclick="openAdminChat()">[ ASK ADMIN ]</div>
    </header>

    <div class="announcement">
        <span class="status-dot"></span> 
        <span>DROP 017 LIVE</span>
        <span style="margin-left:auto;">16D 04H 21M 09S — THEN GONE</span>
    </div>

    <main class="grid" id="product-grid"></main>

    <!-- PRODUCT MODAL -->
    <div id="product-modal" class="modal">
        <div class="modal-body">
            <div class="modal-img">
                <img id="modal-img-src" src="" alt="">
            </div>
            
            <div class="modal-details">
                <h2 class="m-title" id="modal-title"></h2>
                <div class="m-meta"><span id="modal-id"></span> <span style="float:right; font-weight:bold;" id="modal-price"></span></div>
                
                <div id="main-ui">
                    <div class="m-status"><span class="status-dot"></span> LIVE</div>
                    
                    <div class="size-selector" id="size-selector">
                        <button class="size-btn active">M</button>
                        <button class="size-btn">L</button>
                        <button class="size-btn">XL</button>
                    </div>

                    <div class="purchase-options" id="purchase-options">
                        <div>
                            <button class="btn btn-buy" onclick="openCheckout('NORMAL')">BUY NORMAL</button>
                            <div class="subtext">MAX 7 PIECES. 48 HR DELIVERY.</div>
                        </div>
                        <div>
                            <button class="btn btn-lock" onclick="openCheckout('LOCK')">LOCK DROP (+2000 BIRR)</button>
                            <div class="subtext">MURDER DROP. ARCHIVE NAME.</div>
                        </div>
                    </div>
                </div>

                <!-- CHECKOUT UI -->
                <div class="checkout-form" id="checkout-form">
                    <div class="form-title" id="checkout-title">FINISH ORDER</div>
                    
                    <div class="input-group lock-name-group" id="lock-name-group">
                        <label>ARCHIVE NAME (For the Kill Shot)</label>
                        <input type="text" id="lock-name" placeholder="e.g. @Daniel_M">
                    </div>

                    <div class="input-group">
                        <label>PHONE NUMBER</label>
                        <input type="tel" id="phone" placeholder="09...">
                        <button class="btn-share-phone" onclick="requestNativePhone()">📲 AUTO FILL</button>
                    </div>
                    
                    <div class="input-group">
                        <label>CITY / LOCATION</label>
                        <input type="text" id="location" placeholder="Adama / Addis Ababa">
                    </div>

                    <button class="btn-story" onclick="shareToStory()">📸 FLEX THIS DROP ON STORY</button>
                </div>

            </div>
        </div>
    </div>

    <script>
        // TELEGRAM MINI APP INITIALIZATION
        const tg = window.Telegram.WebApp;
        tg.expand();

        // NATIVE COLOR SYNCHRONIZATION
        try {
            tg.setHeaderColor('#f4f1e9');
            tg.setBackgroundColor('#f4f1e9');
        } catch(e) {}

        // HAPTICS HELPER
        const haptic = tg.HapticFeedback;
        function triggerHaptic(type) {
            if (!haptic) return;
            if (type === 'light') haptic.impactOccurred('light');
            if (type === 'heavy') haptic.impactOccurred('heavy');
            if (type === 'select') haptic.selectionChanged();
            if (type === 'success') haptic.notificationOccurred('success');
        }

        // SYNTHESIZED HEAVY INDUSTRIAL AUDIO (Web Audio API)
        function playThudSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + 0.35);
                gain.gain.setValueAtTime(1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.35);
            } catch(e){}
        }

        // 1-CLICK ASK ADMIN CHAT
        function openAdminChat() {
            triggerHaptic('light');
            // Change 'your_telegram_username' to your actual personal Telegram handle!
            try { tg.openTelegramLink('https://t.me/your_telegram_username'); } catch(e) { alert("Contact @your_telegram_username"); }
        }

        // AUTO USERNAME
        let tgUsername = "";
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const u = tg.initDataUnsafe.user;
            tgUsername = u.username ? `@${u.username}` : (u.first_name || "");
        }

        // NATIVE 1-TAP PHONE NUMBER REQUEST
        function requestNativePhone() {
            triggerHaptic('select');
            if (tg.requestContact) {
                tg.requestContact((sent) => {
                    if (sent && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        // Prefill if shared
                        document.getElementById('phone').value = "Shared via Telegram";
                    }
                });
            } else {
                alert("Type phone manually.");
            }
        }

        // FLEX ON TELEGRAM STORY
        function shareToStory() {
            triggerHaptic('light');
            if (tg.shareToStory && currentProduct) {
                tg.shareToStory(window.location.origin + "/" + currentProduct.image, {
                    text: `RAW ${currentProduct.id} — STRAIGHT TO THE MEAT.`
                });
            } else {
                alert("Sharing story...");
            }
        }

        // DATABASE
        let products = [
            { id: 'RAW 017', title: 'MISERY WINNERS CLUB', price: 2500, image: 'input_file_0.png', isLive: true },
            { id: 'RAW 018', title: 'CREATE YOUR OWN LEGACY', price: 2200, image: 'input_file_3.png', isLive: true },
            { id: 'RAW 019', title: 'IN DREAMS', price: 2400, image: 'input_file_1.png', isLive: false, lockedBy: '@DANIEL_M' },
            { id: 'RAW 020', title: 'BRAND DEPT.', price: 2500, image: 'input_file_2.png', isLive: true }
        ];

        let currentProduct = null;
        let orderType = 'NORMAL'; 
        let selectedSize = 'M';

        // CLOUD STORAGE LOADING
        try {
            tg.CloudStorage.getItem('raw_phone', (err, value) => {
                if (value) document.getElementById('phone').value = value;
            });
            tg.CloudStorage.getItem('raw_location', (err, value) => {
                if (value) document.getElementById('location').value = value;
            });
            tg.CloudStorage.getItem('raw_size', (err, value) => {
                if (value) { selectedSize = value; updateSizeUI(value); }
            });
        } catch(e) {}

        // RENDER GRID
        const grid = document.getElementById('product-grid');
        grid.innerHTML = products.map((p, index) => {
            const gone = !p.isLive ? 'gone' : '';
            const stamp = !p.isLive ? '<div class="stamp">GONE</div>' : '';
            const state = p.isLive ? `MAX 7 EXIST` : `<span class="locked-by-text">LOCKED BY ${p.lockedBy}</span>`;
            
            return `
            <article class="card ${gone}" onclick="openModal(${index})">
                <div class="img-wrapper">${stamp}<img src="${p.image}"></div>
                <div class="card-footer">
                    <div class="card-title">${p.title}</div>
                    <div class="card-meta"><span>${p.id}</span><span>${p.price} BIRR</span></div>
                    <div class="card-state"><span>${state}</span><span>${p.isLive ? 'LIVE' : 'GONE'}</span></div>
                </div>
            </article>`;
        }).join('');

        function openModal(index) {
            triggerHaptic('light');
            currentProduct = products[index];
            if(!currentProduct.isLive) return;

            document.getElementById('modal-img-src').src = currentProduct.image;
            document.getElementById('modal-title').innerText = currentProduct.title;
            document.getElementById('modal-id').innerText = currentProduct.id;
            document.getElementById('modal-price').innerText = `${currentProduct.price} BIRR`;
            
            document.getElementById('main-ui').style.display = 'block';
            document.getElementById('checkout-form').style.display = 'none';

            // NATIVE BACK BUTTON
            try {
                tg.BackButton.show();
                tg.BackButton.onClick(closeModal);
            } catch(e) {}

            document.getElementById('product-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            triggerHaptic('light');
            document.getElementById('product-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
            
            try {
                tg.BackButton.hide();
                tg.MainButton.hide();
            } catch(e) {}
        }

        // SIZE LOGIC
        function updateSizeUI(size) {
            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === size);
            });
        }

        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                triggerHaptic('select');
                selectedSize = e.target.innerText;
                updateSizeUI(selectedSize);
                try { tg.CloudStorage.setItem('raw_size', selectedSize); } catch(e) {}
            });
        });

        // CHECKOUT FLOW
        function openCheckout(type) {
            orderType = type;
            
            if (type === 'LOCK') {
                playThudSound(); // INDUSTRIAL SYNTH AUDIO THUD
                triggerHaptic('heavy');
                document.getElementById('checkout-title').innerText = "💀 KILL SHOT INITIATED";
                document.getElementById('checkout-title').style.color = "var(--red)";
                document.getElementById('lock-name-group').style.display = 'block';
                document.getElementById('lock-name').value = tgUsername || "";
            } else {
                triggerHaptic('light');
                document.getElementById('checkout-title').innerText = "FINISH ORDER";
                document.getElementById('checkout-title').style.color = "var(--black)";
                document.getElementById('lock-name-group').style.display = 'none';
            }

            document.getElementById('main-ui').style.display = 'none';
            document.getElementById('checkout-form').style.display = 'block';

            // TELEGRAM MAIN BUTTON
            try {
                const price = type === 'LOCK' ? currentProduct.price + 2000 : currentProduct.price;
                const btnText = type === 'LOCK' ? `CONFIRM KILL SHOT (${price} BIRR)` : `CONFIRM ORDER (${price} BIRR)`;
                
                tg.MainButton.setText(btnText);
                tg.MainButton.setParams({
                    color: type === 'LOCK' ? '#d71920' : '#000000',
                    text_color: '#ffffff'
                });
                tg.MainButton.show();
                tg.MainButton.onClick(submitOrder);
            } catch(e) {}
        }

        // SUBMIT ORDER
        function submitOrder() {
            const phone = document.getElementById('phone').value;
            const location = document.getElementById('location').value;
            const lockName = document.getElementById('lock-name').value;

            if (!phone || !location) { 
                triggerHaptic('heavy');
                alert("Phone and Location are required."); 
                return; 
            }
            if (orderType === 'LOCK' && !lockName) { 
                triggerHaptic('heavy');
                alert("Archive Name is required to Lock the drop."); 
                return; 
            }

            try {
                tg.CloudStorage.setItem('raw_phone', phone);
                tg.CloudStorage.setItem('raw_location', location);
            } catch(e) {}

            triggerHaptic('success');

            const finalPrice = orderType === 'LOCK' ? currentProduct.price + 2000 : currentProduct.price;

            try { tg.MainButton.showProgress(); } catch(e) {}

            const orderData = {
                id: currentProduct.id,
                title: currentProduct.title,
                type: orderType,
                size: selectedSize,
                price: finalPrice,
                phone: phone,
                location: location,
                lockName: lockName ? lockName.toUpperCase() : null
            };

            setTimeout(() => {
                tg.sendData(JSON.stringify(orderData));
                tg.close();
            }, 300);
        }
    </script>
</body>
</html>
